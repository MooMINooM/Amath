<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Math Max Score Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Sarabun:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background-color: #0f381f; /* A-Math classic green board color */
            touch-action: manipulation; /* Improves touch responsiveness */
        }

        /* Tile Wood Texture and Depth */
        .tile {
            background: linear-gradient(145deg, #fcecae, #f1db89);
            box-shadow: 0 4px 0 #cda434, 0 5px 5px rgba(0,0,0,0.3);
            border: 1px solid #e0c878;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .tile:active, .tile.selected {
            transform: translateY(4px);
            box-shadow: 0 0 0 #cda434, 0 1px 2px rgba(0,0,0,0.3);
            border-color: #3b82f6; /* Blue highlight when selected */
        }

        .tile.selected {
            outline: 3px solid #3b82f6;
            outline-offset: 2px;
        }

        /* Board Slot Styles */
        .slot-normal { background-color: #166534; }
        .slot-te { background-color: #ef4444; color: white; } /* Triple Equation - Red */
        .slot-de { background-color: #fbbf24; color: black; } /* Double Equation - Yellow */
        .slot-tp { background-color: #3b82f6; color: white; } /* Triple Piece - Blue */
        .slot-dp { background-color: #f97316; color: white; } /* Double Piece - Orange */

        .slot {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            border: 2px solid #064e3b;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center py-6 px-2 md:px-4">

    <div class="w-full max-w-4xl flex flex-col gap-6">
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl md:text-5xl font-extrabold text-amber-300 drop-shadow-md tracking-wider">A-MATH</h1>
            <p class="text-green-200 text-sm md:text-lg">Max Score Practice - ฝึกต่อสมการให้ได้คะแนนสูงสุด!</p>
        </header>

        <!-- Status Panel -->
        <div class="bg-green-900 rounded-xl p-4 shadow-lg flex justify-between items-center border border-green-700">
            <div class="flex flex-col w-1/3">
                <span class="text-green-300 text-[10px] md:text-xs font-semibold uppercase tracking-wider">Current Score</span>
                <span id="current-score" class="text-3xl md:text-4xl font-bold text-white">0</span>
            </div>
            <div class="w-1/3 flex justify-center">
                <div id="equation-status" class="px-3 md:px-6 py-2 rounded-full font-bold text-xs md:text-sm bg-gray-700 text-gray-300 shadow-inner text-center">
                    รอการวางเบี้ย...
                </div>
            </div>
            <div class="flex flex-col text-right w-1/3 hidden" id="target-score-container">
                <span class="text-green-300 text-[10px] md:text-xs font-semibold uppercase tracking-wider">Max Possible</span>
                <span id="target-score" class="text-3xl md:text-4xl font-bold text-amber-400">?</span>
            </div>
        </div>

        <!-- Game Board (9 slots) -->
        <div class="bg-green-800 p-3 md:p-6 rounded-xl shadow-inner border-2 border-green-950 overflow-x-auto">
            <div class="flex gap-1 md:gap-2 justify-center min-w-max" id="board-container">
                <!-- Slots will be injected here via JS -->
            </div>
        </div>

        <!-- Tile Rack (8 tiles) -->
        <div class="bg-green-950 p-4 md:p-6 rounded-xl shadow-2xl border-t-4 border-amber-900 flex flex-col items-center gap-4 relative">
            <h2 class="text-green-400 text-xs md:text-sm font-semibold mb-1">แป้นเบี้ยของคุณ (คลิกเบี้ยเพื่อเลือก แล้วคลิกที่ช่องเพื่อวาง)</h2>
            <div class="flex flex-wrap gap-2 justify-center min-h-[3rem]" id="rack-container">
                <!-- Tiles will be injected here via JS -->
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-wrap justify-center gap-3">
            <button onclick="resetBoard()" class="px-4 py-2 md:px-6 md:py-3 bg-gray-600 hover:bg-gray-500 text-white font-bold rounded-lg shadow transition transform hover:scale-105 active:scale-95 text-sm md:text-base">
                ดึงเบี้ยกลับทั้งหมด
            </button>
            <button onclick="submitScore()" id="btn-submit" class="px-4 py-2 md:px-6 md:py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow transition transform hover:scale-105 active:scale-95 opacity-50 cursor-not-allowed text-sm md:text-base" disabled>
                ส่งคำตอบ
            </button>
            <button onclick="showHint()" class="px-4 py-2 md:px-6 md:py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg shadow transition transform hover:scale-105 active:scale-95 text-sm md:text-base">
                ยอมแพ้ (ดูคำตอบที่ดีที่สุด)
            </button>
            <button onclick="generateNewPuzzle()" class="px-4 py-2 md:px-6 md:py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg shadow transition transform hover:scale-105 active:scale-95 text-sm md:text-base">
                เริ่มโจทย์ใหม่
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white text-black rounded-2xl p-6 md:p-8 max-w-sm w-full text-center space-y-4 shadow-2xl transform transition-all scale-95" id="modal-content">
            <h2 id="modal-title" class="text-2xl md:text-3xl font-extrabold text-green-700">Result</h2>
            <p id="modal-message" class="text-gray-700 text-base md:text-lg">Message goes here.</p>
            <button onclick="closeModal()" class="mt-4 w-full px-4 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow text-lg">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 9; // Size of our practice row
        const RACK_SIZE = 8;  // Standard A-Math rack size
        
        // Authentic A-Math Tile Set values (0-20, and operators)
        const TILE_VALUES = {
            '0': 1, '1': 1, '2': 1, '3': 1, '4': 2, '5': 2, '6': 2, '7': 2, '8': 2, '9': 2,
            '10': 3, '11': 4, '12': 3, '13': 6, '14': 4, '15': 4, '16': 4, '17': 6, '18': 4, '19': 7, '20': 5,
            '+': 2, '-': 2, '*': 2, '/': 2, '=': 1
        };
        
        const MULTIPLIER_TYPES = ['normal', 'te', 'de', 'tp', 'dp'];
        const MULTIPLIER_LABELS = { 'normal': '', 'te': '3X<br>สมการ', 'de': '2X<br>สมการ', 'tp': '3X<br>ตัวเบี้ย', 'dp': '2X<br>ตัวเบี้ย' };
        const MULTIPLIER_COLORS = { 'normal': 'slot-normal', 'te': 'slot-te', 'de': 'slot-de', 'tp': 'slot-tp', 'dp': 'slot-dp' };

        // Game State
        let currentRack = []; // Array of tile objects
        let currentBoard = new Array(BOARD_SIZE).fill(null);
        let boardMultipliers = new Array(BOARD_SIZE).fill('normal');
        let selectedTileId = null;
        let bestPossibleScore = 0;
        let bestPossibleEquation = [];
        let isProcessingSolver = false;

        function generateRandomSolvableEquation() {
            // Generates a simple solvable equation (Length 5 to 8)
            const ops = ['+', '-', '*', '/'];
            let valid = false;
            let equationTokens = [];
            
            while (!valid) {
                let a = Math.floor(Math.random() * 21); // 0-20
                let b = Math.floor(Math.random() * 21); // 0-20
                let op = ops[Math.floor(Math.random() * ops.length)];
                let c = 0;

                if (op === '+') c = a + b;
                if (op === '-') c = a - b;
                if (op === '*') c = a * b;
                if (op === '/') {
                    if (b === 0) continue; // Avoid /0
                    c = a; 
                    a = c * b; 
                }

                if (c >= 0 && c <= 150) {
                    // Randomly choose whether to use full 10-20 tile or split into digits
                    function numToTokens(num) {
                        if (num <= 9) return [num.toString()];
                        if (num <= 20) {
                            return Math.random() > 0.5 ? [num.toString()] : num.toString().split('');
                        }
                        return num.toString().split('');
                    }
                    
                    let tokensA = numToTokens(a);
                    let tokensB = numToTokens(b);
                    let tokensC = numToTokens(c);
                    
                    equationTokens = [...tokensA, op, ...tokensB, '=', ...tokensC];
                    if (equationTokens.length >= 5 && equationTokens.length <= RACK_SIZE) {
                        valid = true;
                    }
                }
            }
            return equationTokens;
        }

        function createTileObject(char, id) {
            let score = TILE_VALUES[char] || 0;
            // Simulate A-Math multi-operator tiles (+/- and */÷) which have 1 point
            if (char === '+' || char === '-') {
                if (Math.random() < 0.38) score = 1; // Approx 5 out of 13 are 1-point
            }
            if (char === '*' || char === '/') {
                if (Math.random() < 0.33) score = 1; // Approx 4 out of 12 are 1-point
            }

            return {
                id: `tile_${id}`,
                char: char,
                score: score
            };
        }

        function validateEquationArray(tokens) {
            if (tokens.length < 5) return false;
            
            let eqCount = tokens.filter(t => t.char === '=').length;
            if (eqCount !== 1) return false;
            
            let eqIndex = tokens.findIndex(t => t.char === '=');
            if (eqIndex === 0 || eqIndex === tokens.length - 1) return false;

            let left = tokens.slice(0, eqIndex);
            let right = tokens.slice(eqIndex + 1);

            function checkSyntax(side) {
                if (side.length === 0) return false;
                
                let sideStr = '';
                
                for (let i = 0; i < side.length; i++) {
                    let char = side[i].char;
                    let isNum10Plus = !isNaN(char) && parseInt(char) >= 10;
                    
                    // Rule: Two-digit tiles (10-20) cannot be adjacent to other numbers
                    if (isNum10Plus) {
                        if (i > 0 && !isNaN(side[i-1].char)) return false; 
                        if (i < side.length - 1 && !isNaN(side[i+1].char)) return false; 
                    }
                    
                    // No adjacent operators
                    if (i < side.length - 1 && isNaN(char) && isNaN(side[i+1].char)) return false;
                    
                    sideStr += char;
                }
                
                // Must start and end with a number (allow leading negative for math, though rare in simple generated puzzles)
                if (isNaN(side[0].char) && side[0].char !== '-') return false;
                if (isNaN(side[side.length - 1].char)) return false;
                
                // Prevent leading zeros in multi-digit numbers (e.g. 05)
                if (/(^|[^\d])0\d/.test(sideStr)) return false;
                
                // Prevent divide by zero directly
                if (sideStr.includes('/0')) return false;

                return sideStr;
            }

            let leftStr = checkSyntax(left);
            let rightStr = checkSyntax(right);

            if (!leftStr || !rightStr) return false;

            try {
                // Safely evaluate math
                let leftVal = Function(`'use strict'; return (${leftStr})`)();
                let rightVal = Function(`'use strict'; return (${rightStr})`)();
                
                return leftVal === rightVal && Number.isInteger(leftVal);
            } catch (e) {
                return false;
            }
        }

        function calculateScore(boardState) {
            let totalScore = 0;
            let eqMultiplier = 1;
            let usedTiles = 0;
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                let tile = boardState[i];
                if (tile) {
                    usedTiles++;
                    let tileScore = tile.score;
                    let mult = boardMultipliers[i];
                    
                    if (mult === 'tp') tileScore *= 3;
                    if (mult === 'dp') tileScore *= 2;
                    
                    totalScore += tileScore;
                    
                    if (mult === 'te') eqMultiplier *= 3;
                    if (mult === 'de') eqMultiplier *= 2;
                }
            }
            
            let finalScore = totalScore * eqMultiplier;
            // Bingo bonus: If all 8 tiles are used
            if (usedTiles === RACK_SIZE) finalScore += 40; 
            
            return finalScore;
        }

        function findBestSolution(rack, multipliers) {
            let maxScore = 0;
            let bestConfig = [];
            
            function getPermutations(array, size) {
                const results = [];
                function permute(arr, memo) {
                    if (memo.length === size) {
                        results.push(memo);
                        return;
                    }
                    for (let i = 0; i < arr.length; i++) {
                        let curr = arr.slice();
                        let next = curr.splice(i, 1);
                        permute(curr, memo.concat(next));
                    }
                }
                permute(array, []);
                return results;
            }

            // A-Math equations must be at least 5 tiles long
            for (let len = 5; len <= Math.min(rack.length, BOARD_SIZE); len++) {
                let perms = getPermutations(rack, len);
                
                // Track checked string combinations to avoid duplicate eval work
                let checkedStrings = new Set();

                for (let p of perms) {
                    // Use comma to differentiate ["10"] and ["1","0"]
                    let strRep = p.map(t=>t.char).join(',');
                    if (checkedStrings.has(strRep)) continue;
                    checkedStrings.add(strRep);

                    // Fast reject
                    if (p.filter(t => t.char === '=').length !== 1) continue;
                    
                    if (validateEquationArray(p)) {
                        // Slide this valid equation across all possible start positions on the board
                        for (let startIdx = 0; startIdx <= BOARD_SIZE - len; startIdx++) {
                            let testBoard = new Array(BOARD_SIZE).fill(null);
                            for (let i = 0; i < len; i++) {
                                testBoard[startIdx + i] = p[i];
                            }
                            
                            let score = calculateScore(testBoard);
                            if (score > maxScore) {
                                maxScore = score;
                                bestConfig = testBoard;
                            }
                        }
                    }
                }
            }
            return { score: maxScore, board: bestConfig };
        }

        function generateNewPuzzle() {
            currentBoard = new Array(BOARD_SIZE).fill(null);
            selectedTileId = null;
            document.getElementById('target-score-container').classList.add('hidden');
            document.getElementById('btn-submit').disabled = true;
            document.getElementById('btn-submit').classList.add('opacity-50', 'cursor-not-allowed');
            
            // Randomize Board Multipliers
            boardMultipliers = new Array(BOARD_SIZE).fill('normal');
            const premiumTypes = ['te', 'de', 'tp', 'dp', 'tp', 'dp'];
            // Place 2 to 4 random premiums
            let premiumCount = Math.floor(Math.random() * 3) + 2;
            for(let i=0; i<premiumCount; i++) {
                let rIdx = Math.floor(Math.random() * BOARD_SIZE);
                boardMultipliers[rIdx] = premiumTypes[Math.floor(Math.random() * premiumTypes.length)];
            }

            // Generate solvable base equation
            let baseTokens = generateRandomSolvableEquation();
            let rackChars = [...baseTokens];
            
            // Fill remaining rack slots with random numbers/operators
            const extraPool = ['+', '-', '*', '/', '1', '2', '3', '4', '5', '8', '10', '11', '12', '15', '20'];
            while(rackChars.length < RACK_SIZE) {
                rackChars.push(extraPool[Math.floor(Math.random() * extraPool.length)]);
            }
            
            // Shuffle Rack
            rackChars.sort(() => Math.random() - 0.5);
            currentRack = rackChars.map((char, index) => createTileObject(char, index));

            renderAll();
            updateGameStatus();

            // Run Solver asynchronously
            document.getElementById('target-score').innerText = "คิดอยู่...";
            document.getElementById('target-score-container').classList.remove('hidden');
            
            // Slight delay allows the UI to render before the heavy calculation blocking the thread
            setTimeout(() => {
                let solution = findBestSolution(currentRack, boardMultipliers);
                bestPossibleScore = solution.score;
                bestPossibleEquation = solution.board;
                document.getElementById('target-score').innerText = bestPossibleScore;
                
                // Edge case: if generated puzzle has no solution somehow, generate another
                if (bestPossibleScore === 0) {
                    generateNewPuzzle();
                }
            }, 100);
        }

        function renderTileHTML(tile, isBoard = false, index = null) {
            if (!tile) return '';
            const isSelected = selectedTileId === tile.id ? 'selected' : '';
            const textSize = tile.char.length > 1 ? 'text-base md:text-xl' : 'text-lg md:text-2xl';
            return `
                <div class="tile w-10 h-10 md:w-14 md:h-14 rounded flex items-center justify-center text-black font-extrabold ${textSize} cursor-pointer relative select-none animate-pop ${isSelected}" 
                     id="${tile.id}" onclick="handleTileClick(event, '${tile.id}', ${isBoard})">
                    ${tile.char}
                    <span class="absolute bottom-0.5 right-1 text-[9px] md:text-xs text-amber-900 font-bold">${tile.score}</span>
                </div>
            `;
        }

        function renderAll() {
            // Render Board
            const boardContainer = document.getElementById('board-container');
            boardContainer.innerHTML = '';
            for (let i = 0; i < BOARD_SIZE; i++) {
                let mult = boardMultipliers[i];
                let colorClass = MULTIPLIER_COLORS[mult];
                let label = MULTIPLIER_LABELS[mult];
                let tileHTML = currentBoard[i] ? renderTileHTML(currentBoard[i], true, i) : '';
                
                boardContainer.innerHTML += `
                    <div class="slot w-11 h-11 md:w-16 md:h-16 rounded-md flex items-center justify-center relative cursor-pointer ${colorClass}" 
                         onclick="handleSlotClick(${i})">
                        ${tileHTML ? tileHTML : `<span class="text-[8px] md:text-[10px] text-center leading-tight font-bold opacity-80 select-none pointer-events-none">${label}</span>`}
                    </div>
                `;
            }

            // Render Rack
            const rackContainer = document.getElementById('rack-container');
            rackContainer.innerHTML = '';
            currentRack.forEach((tile, index) => {
                rackContainer.innerHTML += renderTileHTML(tile, false, index);
            });
        }

        function handleTileClick(event, tileId, isBoard) {
            if (event) event.stopPropagation(); // Prevent triggering slot click below it

            if (isBoard) {
                 // Direct edit: Clicking a tile on the board returns it to the rack immediately
                 let tileIdxInBoard = currentBoard.findIndex(t => t && t.id === tileId);
                 if (tileIdxInBoard !== -1) {
                     let tile = currentBoard[tileIdxInBoard];
                     currentBoard[tileIdxInBoard] = null;
                     currentRack.push(tile);
                     
                     // If it was selected, deselect it
                     if (selectedTileId === tileId) selectedTileId = null; 
                     
                     renderAll();
                     updateGameStatus();
                 }
                 return;
            }

            // Clicking a tile in the rack
            if (selectedTileId === tileId) {
                selectedTileId = null; // Deselect
            } else {
                selectedTileId = tileId; // Select
            }
            renderAll();
        }

        function handleSlotClick(slotIndex) {
            if (!selectedTileId) {
                // If user clicks an occupied slot without a selected tile, just return it to the rack
                if (currentBoard[slotIndex]) {
                    let tile = currentBoard[slotIndex];
                    currentBoard[slotIndex] = null;
                    currentRack.push(tile);
                    renderAll();
                    updateGameStatus();
                }
                return;
            }

            let tileIdxInRack = currentRack.findIndex(t => t.id === selectedTileId);
            let tileIdxInBoard = currentBoard.findIndex(t => t && t.id === selectedTileId);
            let tileObj = null;

            if (tileIdxInRack !== -1) {
                tileObj = currentRack.splice(tileIdxInRack, 1)[0];
            } else if (tileIdxInBoard !== -1) {
                tileObj = currentBoard[tileIdxInBoard];
                currentBoard[tileIdxInBoard] = null;
            }

            // Swap if target is occupied
            if (currentBoard[slotIndex]) {
                if (tileIdxInRack !== -1) currentRack.push(currentBoard[slotIndex]);
                else if (tileIdxInBoard !== -1) currentBoard[tileIdxInBoard] = currentBoard[slotIndex];
            }

            currentBoard[slotIndex] = tileObj;
            selectedTileId = null;
            renderAll();
            updateGameStatus();
        }

        function resetBoard() {
            currentBoard.forEach((tile, i) => {
                if (tile) {
                    currentRack.push(tile);
                    currentBoard[i] = null;
                }
            });
            selectedTileId = null;
            renderAll();
            updateGameStatus();
        }

        function updateGameStatus() {
            let firstIdx = -1, lastIdx = -1;
            let usedTilesCount = 0;
            
            for(let i=0; i<BOARD_SIZE; i++) {
                if (currentBoard[i]) {
                    if (firstIdx === -1) firstIdx = i;
                    lastIdx = i;
                    usedTilesCount++;
                }
            }

            let statusEl = document.getElementById('equation-status');
            let scoreEl = document.getElementById('current-score');
            let submitBtn = document.getElementById('btn-submit');

            if (firstIdx === -1) {
                statusEl.innerHTML = "รอการวางเบี้ย...";
                statusEl.className = "px-3 md:px-6 py-2 rounded-full font-bold text-xs md:text-sm bg-gray-700 text-gray-300 shadow-inner";
                scoreEl.innerText = "0";
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            // Check for gaps
            let hasGaps = false;
            let currentTokens = [];
            for(let i=firstIdx; i<=lastIdx; i++) {
                if (!currentBoard[i]) {
                    hasGaps = true;
                    break;
                }
                currentTokens.push(currentBoard[i]);
            }

            if (hasGaps) {
                statusEl.innerHTML = "สมการมีช่องว่าง!";
                statusEl.className = "px-3 md:px-6 py-2 rounded-full font-bold text-xs md:text-sm bg-red-900 text-red-300 shadow-inner";
                scoreEl.innerText = "0";
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            let isValid = validateEquationArray(currentTokens);
            
            if (isValid) {
                let score = calculateScore(currentBoard);
                let bingoText = usedTilesCount === RACK_SIZE ? ' 🔥 BINGO!' : '';
                statusEl.innerHTML = "สมการถูกต้อง" + bingoText;
                statusEl.className = "px-3 md:px-6 py-2 rounded-full font-bold text-xs md:text-sm bg-green-500 text-white shadow-inner";
                scoreEl.innerText = score;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                statusEl.innerHTML = "สมการไม่ถูกต้อง / ผิดกฎ";
                statusEl.className = "px-3 md:px-6 py-2 rounded-full font-bold text-xs md:text-sm bg-red-500 text-white shadow-inner";
                scoreEl.innerText = "0";
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function showModal(title, message, isSuccess) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-title').className = `text-2xl md:text-3xl font-extrabold ${isSuccess ? 'text-green-600' : 'text-blue-600'}`;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function submitScore() {
            let userScore = calculateScore(currentBoard);
            if (userScore >= bestPossibleScore) {
                showModal("ยอดเยี่ยมมาก!", `คุณหาคะแนนที่สูงที่สุดได้สำเร็จ!\nคะแนนของคุณคือ: ${userScore} คะแนน`, true);
            } else {
                showModal("ทำได้ดี!", `คุณได้ ${userScore} คะแนน\nแต่คะแนนสูงสุดที่เป็นไปได้คือ ${bestPossibleScore} คะแนน ลองหาดูใหม่นะ!`, false);
            }
        }

        function showHint() {
            if (bestPossibleScore === 0) return;
            
            resetBoard();
            
            // Reconstruct the best equation onto the board
            for(let i=0; i<BOARD_SIZE; i++) {
                if (bestPossibleEquation[i]) {
                    let char = bestPossibleEquation[i].char;
                    let rackIdx = currentRack.findIndex(t => t.char === char);
                    if (rackIdx !== -1) {
                        currentBoard[i] = currentRack.splice(rackIdx, 1)[0];
                    }
                }
            }
            renderAll();
            updateGameStatus();
            showModal("คำตอบที่ดีที่สุด", `นี่คือหนึ่งในรูปแบบสมการที่ให้คะแนนสูงสุดที่ ${bestPossibleScore} คะแนน`, false);
        }

        window.onload = generateNewPuzzle;
    </script>
</body>
</html>
